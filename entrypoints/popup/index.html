<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aiTran</title>
    <link rel="icon" type="image/png" href="/icons/32.png" />
  </head>
  <body>
    <main class="app">
      <section class="translation-group" aria-label="网页翻译">
      <header class="topbar">
        <div class="brand">
          <img class="brand-mark" src="/icons/128.png" alt="AiT" />
          <div class="brand-copy"><strong>aiTran</strong></div>
        </div>
        <select id="display-mode" class="mode-action" aria-label="网页翻译显示模式"><option value="bilingual">双语</option><option value="translation-only">仅译文</option></select>
        <button id="translate" class="primary-action" disabled>翻译网页</button>
      </header>

      <section class="control-card" aria-label="翻译配置">
        <div class="language-panel">
          <label class="select-shell"><span>源语言</span><select id="source-language"></select></label>
          <button id="swap-languages" class="language-arrow" title="交换语言">⇄</button>
          <label class="select-shell"><span>目标语言</span><select id="target-language"></select></label>
        </div>
        <div class="service-panel">
          <label class="field-label" for="provider">翻译服务</label>
          <select id="provider"></select>
        </div>
        <div id="status" class="status" role="status" aria-live="polite"></div>
      </section>
      </section>

      <button id="summarize-page" class="summary-action" disabled><img class="summary-icon" src="/icons/32.png" alt="" /><span><strong>AI 总结当前页面</strong><small>核心结论 · 关键要点</small></span><b aria-hidden="true">›</b></button>

      <section class="popup-section compact-section">
        <div class="section-heading"><span>页面功能</span><small>作用于当前网页</small></div>
        <div class="feature-grid">
          <button class="feature-card toggle-card" id="selection-translate"><span>划词翻译</span><i aria-hidden="true"></i></button>
          <button class="feature-card toggle-card" id="hover-translate"><span>悬停翻译</span><i aria-hidden="true"></i></button>
          <button class="feature-card toggle-card" id="floating-ball"><span>悬浮按钮</span><i aria-hidden="true"></i></button>
          <button class="feature-card" id="input-translate"><span>输入框翻译</span><em id="input-shortcut" hidden></em><b aria-hidden="true">›</b></button>
        </div>
      </section>

      <section class="popup-section">
        <div class="section-heading"><span>更多工具</span><small>在新页面打开</small></div>
        <div class="tool-grid">
          <button class="tool-card" id="text-translate"><span class="tool-icon">T</span><span><strong>文本翻译</strong><small>长文本工作台</small></span></button>
          <button class="tool-card" id="document-translate"><span class="tool-icon pdf">PDF</span><span><strong>文档翻译</strong><small>PDF / 字幕</small></span></button>
        </div>
      </section>

      <footer>
        <div class="footer-links">
          <button id="options" class="footer-button"><span>⚙</span> 设置</button>
          <button id="more" class="footer-button">隐私</button>
        </div>
        <span class="version">v0.3.21</span>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
