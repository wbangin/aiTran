<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>aiTran</title>
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <div class="brand-mark">AI</div>
          <div class="brand-copy"><strong>aiTran</strong><span>网页双语翻译</span></div>
        </div>
        <div class="edition-badge"><span></span> 免费版</div>
      </header>

      <section class="control-card" aria-label="翻译配置">
        <div class="language-panel">
          <label class="select-shell"><span>源语言</span><select id="source-language"></select></label>
          <button id="swap-languages" class="language-arrow" title="交换语言">⇄</button>
          <label class="select-shell"><span>目标语言</span><select id="target-language"></select></label>
        </div>
        <div class="service-panel">
          <span class="field-label">翻译服务</span>
          <select id="provider"></select>
        </div>
      </section>

      <div id="status" class="status">准备就绪</div>

      <section class="main-action-row">
        <button id="display-mode" class="mode-action" title="切换双语/仅译文">双语</button>
        <button id="translate" class="primary-action">翻译网页 <kbd id="page-shortcut">Alt+A</kbd></button>
      </section>

      <section class="popup-section">
        <div class="section-heading"><span>翻译工具</span><small>在新页面打开</small></div>
        <div class="tool-grid">
          <button class="tool-card" id="text-translate"><span class="tool-icon">T</span><span><strong>文本翻译</strong><small>长文本工作台</small></span><b>›</b></button>
          <button class="tool-card" id="document-translate"><span class="tool-icon pdf">PDF</span><span><strong>文档翻译</strong><small>PDF / 字幕</small></span><b>›</b></button>
        </div>
      </section>

      <section class="popup-section compact-section">
        <div class="section-heading"><span>页面功能</span><small>作用于当前网页</small></div>
        <div class="feature-grid">
          <button class="feature-card" id="input-translate"><span class="feature-icon">⌨</span><span>输入框</span><em id="input-shortcut">Alt+I</em></button>
          <button class="feature-card toggle-card" id="selection-translate" title="划词翻译使用当前选择的翻译服务；已翻译内容会使用本地缓存"><span class="feature-icon">划</span><span>划词</span><i></i></button>
          <button class="feature-card toggle-card" id="hover-translate"><span class="feature-icon">悬</span><span>悬停</span><i></i></button>
          <button class="feature-card toggle-card" id="floating-ball"><span class="feature-icon">浮</span><span>悬浮按钮</span><i></i></button>
        </div>
      </section>

      <footer>
        <div class="footer-links">
          <button id="options" class="footer-button"><span>⚙</span> 设置</button>
          <button id="more" class="footer-button">隐私</button>
        </div>
        <span class="version">v0.3.8</span>
      </footer>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
